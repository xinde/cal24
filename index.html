<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06091a">
<meta name="description" content="24点 · 分步计算: 每次选两个数字和运算符得出结果, 结果继续参与运算, 直到凑出 24。">
<title>24点 · 极智卡牌</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a1a'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23f6c453'%3E24%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="24点">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<!-- ambient background -->
<div class="bg" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="grid-overlay"></div>
  <div class="vignette"></div>
</div>

<canvas id="fx-canvas" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>

<main class="app">
  <!-- ===== header: row1=mode+sound | row2=hud (居中) ===== -->
  <header class="top">
    <div class="top-row1">
      <div class="seg" role="radiogroup" aria-label="游戏模式">
        <button class="seg-btn is-on" id="modeTimer" data-mode="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg> 计时</button>
        <button class="seg-btn" id="modeCount" data-mode="count"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-2-1-4 0-8z"/></svg> 挑战</button>
      </div>
      <button class="icon-btn" id="soundBtn" title="声音开关" aria-pressed="true"></button>
    </div>

    <div class="top-row2">
      <div class="hud">
        <div class="stat">
          <span class="stat-label">用时</span>
          <span class="stat-value stat-time" id="timer">00.0s</span>
        </div>
        <div class="stat">
          <span class="stat-label">最佳</span>
          <span class="stat-value" id="best">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">连对</span>
          <span class="stat-value" id="streak">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== table ===== -->
  <section class="table" aria-label="牌桌">
    <div class="table-meta">
      <span id="roundInfo">第 1 局</span>
    </div>

    <div class="felt" id="felt">
      <div class="felt-spot"></div>
      <div class="pool" id="pool" aria-live="polite"></div>
      <div class="pool-hint" id="poolHint">选择两个数字, 再点运算符得出结果</div>
    </div>

    <div class="steps" id="steps" aria-live="polite"></div>

    <div class="message" id="message" role="status"></div>
    <div class="answer" id="answer" aria-live="polite"></div>
  </section>

  <!-- ===== operators ===== -->
  <section class="ops" aria-label="运算符">
    <button class="op op-add" data-op="+" title="加"><span>＋</span><small>加</small></button>
    <button class="op op-sub" data-op="-" title="减"><span>－</span><small>减</small></button>
    <button class="op op-mul" data-op="*" title="乘"><span>×</span><small>乘</small></button>
    <button class="op op-div" data-op="/" title="除"><span>÷</span><small>除</small></button>
  </section>

  <!-- ===== controls: row1=发牌|撤销  row2=提示|公布答案 ===== -->
  <nav class="controls" aria-label="操作">
    <div class="ctrl-row">
      <button class="btn btn-gold" id="deal"><span class="btn-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 8h14M5 16h14"/></svg></span>发牌</button>
      <button class="btn btn-ghost btn-undo" id="undo"><span class="btn-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 1 3 7"/></svg></span>撤销</button>
    </div>
    <div class="ctrl-row">
      <button class="btn btn-ghost" id="hint"><span class="btn-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/></svg></span>提示 <em id="hintLeft">×2</em></button>
      <button class="btn btn-ghost" id="reveal"><span class="btn-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></span>公布答案</button>
    </div>
  </nav>

  <p class="footnote">先选两个数字再点运算符 · 结果自动投入池中 · 算出 24 自动结算 · Space 发牌 · Backspace 撤销</p>
</main>

<!-- ===== success overlay ===== -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-badge" id="overlayBadge"></div>
    <div class="overlay-title" id="overlayTitle">答对了!</div>
    <div class="overlay-rows" id="overlayRows"></div>
    <button class="btn btn-gold btn-lg" id="overlayOk">再来一局</button>
  </div>
</div>

<script src="js/solver.js?v=3"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/effects.js?v=3"></script>
<script src="js/game.js?v=3"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
